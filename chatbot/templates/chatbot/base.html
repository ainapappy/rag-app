{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}rag-app — Chat{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'chatbot/chat.css' %}">
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'chatbot/chat.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<header class="topbar">
    <span class="brand">rag-app</span>
    {% if user.is_authenticated %}
        <span class="user">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="link">Déconnexion</button>
        </form>
    {% endif %}
</header>
<main class="layout">
    {% block content %}{% endblock %}
</main>
</body>
</html>
