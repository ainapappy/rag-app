{% extends "chatbot/base.html" %}
{% block title %}Connexion — rag-app{% endblock %}
{% block content %}
<section class="mx-auto mt-16 w-full max-w-sm rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h1 class="text-xl font-semibold">Connexion</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
        Le chat est réservé aux utilisateurs connectés.
    </p>
    <form method="post" class="mt-4 space-y-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="w-full rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-300">
            Se connecter
        </button>
    </form>
</section>
{% endblock %}
